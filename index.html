<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lo-Fi Night Visualizer</title>
    <style>
    body {
        margin: 0;
        background: #05000a;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        height: 100vh; /* Занимаем всю высоту экрана */
    }
    
    canvas {
        position: absolute;
        top: 0;
        left: 0;
        filter: blur(1px) contrast(1.2);
    }
    
    /* Контейнер теперь центрирует кнопку по обоим осям */
    #ui {
        z-index: 10;
        display: flex;
        justify-content: center;
        align-items: center;
        width: 100%;
        height: 100%;
    }
    
    button {
        padding: 20px 50px; 
        background: rgba(188, 19, 254, 0.05);
        color: #bc13fe;
        border: 2px solid #bc13fe; 
        border-radius: 50px;
        cursor: pointer;
        font-size: 16px;
        letter-spacing: 4px; 
        text-transform: uppercase;
        box-shadow: 0 0 25px rgba(188, 19, 254, 0.2);
        transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(5px); 
    }
    
    button:hover {
        background: #bc13fe;
        color: #fff;
        box-shadow: 0 0 50px rgba(188, 19, 254, 0.8);
        transform: scale(1.05); 
    }
</style>
</head>
<body>

    <div id="ui">
        <button id="startBtn">ACTIVATE NIGHT MODE</button>
    </div>
    
    <canvas id="canvas"></canvas>

    <script src="draw.js"></script>
</body>
</html>
